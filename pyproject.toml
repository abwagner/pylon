[project]
name = "pylon"
version = "0.1.0"
description = "Self-hosted GitHub→Plane webhook bridge for Plane Community Edition"
readme = "README.md"
license = "MIT"
authors = [{ name = "Andrew Wagner" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Software Development :: Bug Tracking",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.urls]
Repository = "https://github.com/abwagner/pylon"
Issues = "https://github.com/abwagner/pylon/issues"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
